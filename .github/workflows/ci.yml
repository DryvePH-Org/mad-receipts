# Every push and pull request: lint, typecheck, unit tests and a production build.
# A push to main that passes also deploys to the server (see deploy.yml).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Type-checking the whole app (Google APIs + petty cash) needs more than Node's default memory on small machines.
      - run: npm run typecheck
      - run: npm test
      - name: Build (only the two public values are needed)
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
